    - generic [ref=e177]:
      - generic [ref=e178]:
        - heading "About RoadGuard" [level=2] [ref=e179]
        - paragraph [ref=e180]: A longer walk-through for citizens and reviewers who want to see what is actually running behind each verdict.
      - generic [ref=e181]:
        - generic [ref=e182]:
          - heading "Five-agent pipeline" [level=3] [ref=e183]
          - list [ref=e184]:
            - listitem [ref=e185]: Sanitizer - validates the submission, strips tracking fields, keeps only what the agents need.
            - listitem [ref=e186]: Signal extractor - reads the free-text description and the YOLO detection, lists the signals that matter.
            - listitem [ref=e187]: "Supervisor - routes the case: direct answer, more evidence, or deep agentic workup. Routing is LLM-decided, not a rule tree."
            - listitem [ref=e188]: Profile builder - normalises the hazard into a defect profile (class, severity, confidence) the retriever can match on.
            - listitem [ref=e189]: RAG retriever - pulls the municipal standards and safety references that apply to this exact defect.
            - listitem [ref=e190]: "Decision - produces the final verdict: urgent, standard, needs more evidence, or human review, with a cited rationale."
            - listitem [ref=e191]: Approval gate - writes a signed approval row for the supervisor on duty to decide.
        - generic [ref=e192]:
          - heading "What the detector sees" [level=3] [ref=e193]
          - paragraph [ref=e194]: "A YOLOv8 model runs in your browser (ONNX Runtime Web), trained on the RDD2022 road-damage dataset. It names the defects by the dataset's own class ids:"
          - list [ref=e195]:
            - listitem [ref=e196]: D00 - longitudinal crack (along the direction of travel).
            - listitem [ref=e197]: D10 - transverse crack (across the road).
            - listitem [ref=e198]: D20 - alligator cracking (interconnected network, a structural warning sign).
            - listitem [ref=e199]: D40 - pothole (localised break-up of the surface).
          - paragraph [ref=e200]: The citizen view shows a plain-language verdict; the operator view shows the class, confidence, bounding boxes, and the full agent trace.
        - generic [ref=e201]:
          - heading "Models in production" [level=3] [ref=e202]
          - list [ref=e203]:
            - listitem [ref=e204]: qwen2.5:7b - signal extractor, decision writer.
            - listitem [ref=e205]: llama3.1:8b - supervisor routing.
            - listitem [ref=e206]: qwen2.5:3b - profile builder.
            - listitem [ref=e207]: llama3.2:3b - RAG retriever reasoning.
            - listitem [ref=e208]: granite3.3:2b - sanitizer and short-form helpers.
          - paragraph [ref=e209]: All five are open-source weights served locally through Ollama on an Oracle A1.Flex ARM server (4 OCPU, 23 GB RAM). Zero cloud-API cost, zero data leaving the municipal network.
        - generic [ref=e210]:
          - heading "Standards grounding" [level=3] [ref=e211]
          - paragraph [ref=e212]: Every verdict cites the specific entries from the municipal maintenance playbook that justified it. The retriever pulls from a vector index of standards passages; the decision agent must quote at least one, or the verdict is downgraded to human review.
        - generic [ref=e213]:
          - heading "What is kept, for how long" [level=3] [ref=e214]
          - list [ref=e215]:
            - listitem [ref=e216]: "Submitted photo: 7 days on the municipal server, then auto-deleted."
            - listitem [ref=e217]: "Case record (decision, rationale, cited sources, trace): kept with the hazard id for audit."
            - listitem [ref=e218]: "Hard cap: 5 GB total image storage; the oldest photos are evicted first."
        - generic [ref=e219]:
          - heading "Open design" [level=3] [ref=e220]
          - paragraph [ref=e221]:
            - text: The source lives at
            - link "github.com/orarr2/RoadGuard" [ref=e222] [cursor=pointer]:
              - /url: https://github.com/orarr2/RoadGuard
            - text: . The agent prompts, the RAG passages, the routing policy and the verdict schema are all in the repo. The whole trace of a case can be audited by the supervisor on duty.
    - generic [ref=e223]:
      - heading "Frequently asked" [level=2] [ref=e225]
      - generic [ref=e226]:
        - generic [ref=e227]:
          - heading "Who sees my photo?" [level=3] [ref=e228]
          - paragraph [ref=e229]: Only the municipal operations team, through a private page gated to the city's internal network. The photo is kept for 7 days on the city server for comparison and then deleted automatically.
        - generic [ref=e230]:
          - heading "Will something actually get fixed?" [level=3] [ref=e231]
          - paragraph [ref=e232]: RoadGuard is a decision-support tool. It routes your report to the right queue and gives the supervisor the context to decide. The actual fix is a work order the municipality dispatches - we show you the agent's recommendation and the case reference, nothing more is promised.
        - generic [ref=e233]:
          - heading "Why does it take 1-3 minutes for the verdict?" [level=3] [ref=e234]
          - paragraph [ref=e235]: The AI agents run entirely on local open-source models (no cloud API bill) on a modest ARM server. Each agent takes 5-30 seconds. Your part finishes in seconds; the server works in the background and the page updates when the verdict is ready.