          - generic [ref=e143]: a
          - heading "Live operator trace" [level=3] [ref=e144]
          - paragraph [ref=e145]: A private operations page shows every agent step - which prompt was asked, which standard was cited, which action was recommended - so the municipality can audit any decision.
        - generic [ref=e146]:
          - generic [ref=e147]: b
          - heading "Twice-daily digest" [level=3] [ref=e148]
          - paragraph [ref=e149]: At 08:00 and 20:00 the system builds a report of every citizen hazard with the photos, the recommended action, the cited standard and the current status. It goes to the supervisor on duty.
        - generic [ref=e150]:
          - generic [ref=e151]: c
          - heading "Signed approval links" [level=3] [ref=e152]
          - paragraph [ref=e153]: Every urgent and human-review verdict creates an approval row with a signed one-click link. The supervisor approves or denies with a reason, and the decision is attached to the case forever.
