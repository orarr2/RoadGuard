        - generic [ref=e17]: A public-service road-safety reporting system
        - heading "See a hazard? Report it in one tap, the city handles the rest." [level=1] [ref=e19]
        - paragraph [ref=e20]: Help keep your streets safe. Snap a photo of a pothole, a crack, or any broken piece of pavement and send it in. A detector in your browser plus a multi-agent AI pipeline on the municipal server classify the damage, cross-check it against the current repair standards, and either queue it for regular maintenance or escalate it to a supervisor. Every report is tracked, every verdict a supervisor sees is grounded in a specific procedure, and a human always has the final say before any crew is dispatched.
