    - generic [ref=e88]:
      - generic [ref=e89]:
        - heading "How it works" [level=2] [ref=e90]
        - paragraph [ref=e91]: Three moving parts, all working together.
      - generic [ref=e92]:
        - generic [ref=e93]:
          - generic [ref=e94]: "01"
          - heading "Snap a photo in the browser" [level=3] [ref=e95]
          - paragraph [ref=e96]:
            - text: Open the site on your phone, point the back camera at the hazard, or upload a photo you already took. A YOLOv8 object detector trained on the
            - strong [ref=e97]: RDD2022
            - text: road-damage dataset runs
            - emphasis [ref=e98]: on your device
            - text: "using onnxruntime-web and finds the four pavement defect types the municipality cares about: longitudinal cracks, transverse cracks, alligator cracking and potholes. The photo is sent to the city server with your report so a supervisor can see what you saw."
        - generic [ref=e99]:
          - generic [ref=e100]: "02"
          - heading "5 AI agents triage your report" [level=3] [ref=e101]
          - paragraph [ref=e102]:
            - text: "On the server, a pipeline of five cooperating agents, each running a different open-source language model, analyses the report: an"
            - strong [ref=e103]: intake
            - text: agent reads your description, a
            - strong [ref=e104]: perception
            - text: agent interprets the detector output, a
            - strong [ref=e105]: research
            - text: agent looks up the matching municipal repair standard, a
            - strong [ref=e106]: decision
            - text: agent picks one of four actions, and a
            - strong [ref=e107]: supervisor
            - text: agent short-circuits obviously-hard cases straight to a human. The whole chain is logged step by step.
        - generic [ref=e108]:
          - generic [ref=e109]: "03"
          - heading "Humans stay in the loop" [level=3] [ref=e110]
          - paragraph [ref=e111]:
            - text: "The agent recommends:"
            - strong [ref=e112]: urgent dispatch
            - text: (crew notified now),
            - strong [ref=e113]: standard queue
            - text: (routine maintenance),
            - strong [ref=e114]: needs more evidence
            - text: (we ask you for one more photo) or
            - strong [ref=e115]: human review
            - text: (a municipal supervisor decides). Nothing is ever dispatched automatically. Every urgent and human-review case is a recommendation the supervisor must approve, and the approval is tracked against the case for accountability.
    - generic [ref=e116]:
      - generic [ref=e117]:
        - heading "What RoadGuard sees" [level=2] [ref=e118]
        - paragraph [ref=e119]: Four classes from the RDD2022 benchmark - the four most common pavement defects in city streets.
      - generic [ref=e120]:
        - generic [ref=e121]:
          - heading [level=3] [ref=e122]:
            - text: Longitudinal crack
            - code [ref=e123]: (D00)
          - paragraph [ref=e124]: A crack running along the road's travel direction. Usually caused by poor joint construction or temperature stress. Early repair is cheap; left untreated, water seeps in and the pavement fails.
        - generic [ref=e125]:
          - heading [level=3] [ref=e126]:
            - text: Transverse crack
            - code [ref=e127]: (D10)
          - paragraph [ref=e128]: A crack running across the travel direction. Often starts at a construction joint or reflects a crack in the base layer. Routine maintenance queue when caught early.
        - generic [ref=e129]:
          - heading [level=3] [ref=e130]:
            - text: Alligator cracking
            - code [ref=e131]: (D20)
          - paragraph [ref=e132]: Interconnected cracks forming a scaly pattern - the pavement's base layer is failing. Typically needs partial-depth patching before it becomes a pothole.
        - generic [ref=e133]:
          - heading [level=3] [ref=e134]:
            - text: Pothole
            - code [ref=e135]: (D40)
          - paragraph [ref=e136]: A localized hole where surface material has broken away. The most dangerous class for vehicles and cyclists - on a main road with lane obstruction, this is an urgent-dispatch case.
    - generic [ref=e137]:
      - generic [ref=e138]:
        - heading "What happens after you report" [level=2] [ref=e139]
        - paragraph [ref=e140]: Your part is one tap. Here is what the city sees on the other side.
      - generic [ref=e141]:
